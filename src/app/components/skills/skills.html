<section class="skills">
  <div class="container">
    <h2 class="section-title">{{ i18n.t('skills.title') }}<span class="accent">.</span></h2>

    <div class="skill-groups">
      @for (group of groups; track group.labelKey) {
      <div class="skill-group">
        <h3>{{ i18n.t(group.labelKey) }}</h3>
        <ul class="skill-list">
          @for (skill of group.skills; track skill.name) {
          <li class="skill-item">
            <img [src]="skill.iconPath" alt="" class="skill-icon" />
            {{ skill.name }}
          </li>
          }
        </ul>
      </div>
      }
    </div>
  </div>
</section>
