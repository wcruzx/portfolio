<section class="experience" id="experience">
  <div class="container">
    <h2 class="section-title">{{ i18n.t('experience.title') }}<span class="accent">.</span></h2>

    <ol class="timeline">
      @for (exp of experiences; track exp.id) {
      <li [class.current]="exp.current">
        <div class="period">{{ i18n.pick(exp.period) }}</div>
        <div class="rail" aria-hidden="true"></div>
        <div class="details">
          <h3 class="job-title">{{ exp.jobTitle }}</h3>
          <div class="company-name">{{ i18n.pick(exp.company) }}</div>
        </div>
      </li>
      }
    </ol>
  </div>
</section>
