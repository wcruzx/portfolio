<section class="education">
  <div class="container">
    <h2 class="section-title">{{ i18n.t('education.title') }}<span class="accent">.</span></h2>

    <ol class="education-list">
      @for (education of educationList; track education.id) {
      <li>
        <span class="period">{{ i18n.pick(education.period) }}</span>
        <div>
          <h3>{{ i18n.pick(education.courseName) }}</h3>
          <div class="institution">{{ education.institution }}</div>
        </div>
        <span class="course-type">{{ i18n.pick(education.courseType) }}</span>
      </li>
      }
    </ol>
  </div>
</section>
